<!DOCTYPE html>
<html lang='en'>
<head>
    <meta charset='utf-8'>
    <meta name='viewport' content='width=device-width, initial-scale=1'>
    <title>Student Infomration</title>
      <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body>
    <div class="container mt-5">
        <div class="row d-flex justify-content-center">
            <div class="col-md-5">
                <div class="card shadow-lg mt-5">
                    <div class="card-header bg-primary text-white text-center">
                            <p class="h2">Student Information</p>
                    </div>
                    <div class="card-body">
                        <ul class="list-group">
                            <li class="list-group-item">
                                <span class="fw-bold">StudentId : {{student.StudentId}}</span>
                            </li>

                            <li class="list-group-item">
                                <span class="fw-bold">StudentName : {{student.StuddentName}}</span>
                            </li>

                            <li class="list-group-item">
                                <span class="fw-bold">StudentMarks : {{student.StudentMarks}}</span>
                            </li>
                        </ul>
                    </div>
                    <div class="card-footer">
                       
                                    <a href="/edit/{{student.StudentId}}/">

                                    <i class="bi bi-pencil-square text-success fs-4  float-start"></i>
                                    </a>
                                    <a href="/delete/{{student.StudentId}}/">

                                        <i class="bi bi-trash-fill text-danger fs-4 float-end"></i>
                                    </a>
                                   
                                     <a href="/" class="btn btn-warning btn-md d-block mt-5">
                                       Back
                                    </a>
                                   

                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
