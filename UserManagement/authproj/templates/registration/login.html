{%extends 'myapp/base.html'%}
{%load widget_tweaks%}
{%block content_block%}
    <div class="container">
        <p class="h1 text-center text-primary">Login  Page</p>
        <div class="row d-flex justify-content-center">
            <div class="col-md-5">
                <div class="card">
                    <div class="card-header bg-primary text-white text-center">
                        <p class="h2">Login Here</p>
                    </div>
                    <div class="card-body">
                      <form action="" method="POST">
                        {%csrf_token%}
                        <div class="mb-2">
                            <label for="" class="form-label">User Name</label>
                            {%render_field form.username class="form-control" placeholder="User Name"%}
                        </div>
                        <div class="mb-2">
                            <label for="" class="form-label">Password</label>
                            {%render_field  form.password type="password" class="form-control" placeholder="Password"%}
                        </div>
                        <button class="btn btn-md btn-danger w-100">Login</button>
                        <label for="" class="form-label">
                            Don't you have account ?    <a href="/register">Create</a>
                        </label>
                      </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
{%endblock%}
